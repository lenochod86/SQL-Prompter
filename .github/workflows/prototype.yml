name: Prototype VSIX

on:
  push:
    paths:
      - 'prototype/**'
      - '.github/workflows/prototype.yml'
  pull_request:
    paths:
      - 'prototype/**'
      - '.github/workflows/prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build VSIX
        run: dotnet build prototype/SqlPrompter.Prototype/SqlPrompter.Prototype.csproj -c Release -v:minimal
      - uses: actions/upload-artifact@v4
        with:
          name: SqlPrompter.Prototype
          path: prototype/SqlPrompter.Prototype/bin/Release/net48/*.vsix
          if-no-files-found: error
