name: Prototype VSIX

# The prototype is obsolete: it builds only on demand (a Windows build costs twice the billed minutes).
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build VSIX
        run: dotnet build prototype/SqlPrompter.Prototype/SqlPrompter.Prototype.csproj -c Release -v:minimal
      - uses: actions/upload-artifact@v7
        with:
          name: SqlPrompter.Prototype
          path: prototype/SqlPrompter.Prototype/bin/Release/net48/*.vsix
          if-no-files-found: error
