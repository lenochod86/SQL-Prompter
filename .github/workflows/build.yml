name: Build

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'SqlPrompter.slnx'
      - 'nuget.config'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'SqlPrompter.slnx'
      - 'nuget.config'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Core and metadata tests
        run: dotnet test tests/SqlPrompter.Tests/SqlPrompter.Tests.csproj -v:minimal

  vsix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build VSIX
        run: dotnet build src/SqlPrompter.Ssms/SqlPrompter.Ssms.csproj -c Release -v:minimal
      - uses: actions/upload-artifact@v7
        with:
          name: SqlPrompter
          path: src/SqlPrompter.Ssms/bin/Release/net48/*.vsix
          if-no-files-found: error
