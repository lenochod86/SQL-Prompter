name: Build

# Billed minutes matter (the repository is private, a Windows minute counts twice), so:
# - every push to a pull request runs only the cheap Ubuntu job (tests and version checks);
# - the Windows VSIX build runs for a pull request only when it has the label `build-vsix` (added when the work is ready, see CLAUDE.md), and manually;
# - pushes to main run the tests only (the merged tree was built and tested in its pull request).
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'SqlPrompter.slnx'
      - 'nuget.config'
      - '.github/workflows/build.yml'
      - '.github/scripts/**'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'SqlPrompter.slnx'
      - 'nuget.config'
      - '.github/workflows/build.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its running build; builds of main always finish.
concurrency:
  # Labeling a pull request (which starts only the VSIX job) must not cancel the test run of the same push.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'labeled' && 'label' || 'run' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Tests and, for a pull request, the version checks: one cheap Ubuntu job (labeling a pull request does not run it again).
  test:
    if: github.event_name != 'pull_request' || github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Core and metadata tests
        run: dotnet test tests/SqlPrompter.Tests/SqlPrompter.Tests.csproj -v:minimal -warnaserror
      - name: Check VSIX and menu versions
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: ./.github/scripts/Check-Versions.ps1 -Base origin/${{ github.base_ref }}

  # The Windows build runs on the self-hosted runner of the development PC (label `vsix`, no billed minutes; the Windows service in E:\actions-runner): only for a pull request with the label `build-vsix`, and on demand. When the PC is off the job waits in the queue; to use GitHub's
  # Windows runner instead (billed twice) change `runs-on` to `windows-latest`.
  vsix:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'build-vsix') &&
       (github.event.action != 'labeled' || github.event.label.name == 'build-vsix'))
    runs-on: [self-hosted, vsix]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build VSIX
        run: dotnet build src/SqlPrompter.Ssms/SqlPrompter.Ssms.csproj -c Release -v:minimal -warnaserror
      - name: Read version inside the VSIX
        id: vsix
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $vsix = Get-Item src/SqlPrompter.Ssms/bin/Release/net48/*.vsix
          $zip = [IO.Compression.ZipFile]::OpenRead($vsix.FullName)
          try {
            $entry = $zip.Entries | Where-Object FullName -eq 'extension.vsixmanifest'
            $reader = New-Object IO.StreamReader($entry.Open())
            $version = ([xml]$reader.ReadToEnd()).PackageManifest.Metadata.Identity.Version
            $reader.Dispose()
          }
          finally {
            $zip.Dispose()
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "VSIX **$($vsix.Name)**, version **$version**, commit ``$env:GITHUB_SHA``" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        with:
          name: SqlPrompter-${{ steps.vsix.outputs.version }}
          path: src/SqlPrompter.Ssms/bin/Release/net48/*.vsix
          if-no-files-found: error
